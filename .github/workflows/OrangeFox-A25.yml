name: OrangeFox A25

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: OrangeFox manifest branch
        required: true
        default: '12.1'
      device_tree_branch:
        description: Device tree branch
        required: true
        default: main
      device_tree_commit:
        description: Optional device tree commit SHA (takes precedence over branch)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          set -euxo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 20m sudo apt-get update
          timeout --foreground --signal=TERM --kill-after=30s 20m sudo apt-get install -y aria2
          scripts_dir="$RUNNER_TEMP/orangefox-misc-scripts"
          rm -rf "$scripts_dir"
          timeout --foreground --signal=TERM --kill-after=30s 10m git clone https://gitlab.com/OrangeFox/misc/scripts "$scripts_dir"
          cd "$scripts_dir"
          timeout --foreground --signal=TERM --kill-after=30s 45m sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox
        env:
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git config --global user.name "lazycodebuilder"
          git config --global user.email "154446636+lazycodebuilder@users.noreply.github.com"
          echo "[sync] cloning OrangeFox sync helper"
          timeout --foreground --signal=TERM --kill-after=30s 10m git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          echo "[sync] starting OrangeFox manifest sync"
          export GIT_TERMINAL_PROMPT=0
          setsid bash -x ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH" &
          sync_pid=$!
          (
            sleep 30m
            echo "[sync] watchdog: terminating sync process group after 30 minutes"
            kill -TERM -- "-$sync_pid" 2>/dev/null || true
            sleep 30s
            kill -KILL -- "-$sync_pid" 2>/dev/null || true
          ) &
          watchdog_pid=$!
          set +e
          wait "$sync_pid"
          sync_status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          set -e
          test "$sync_status" -eq 0
          manifest_sha=$(cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH" && repo manifest -r | sha256sum | cut -d' ' -f1)
          echo "MANIFEST_SHA=$manifest_sha" >> "$GITHUB_ENV"
          echo "[sync] OrangeFox manifest sync completed"

      - name: Clone A25 device tree
        env:
          DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
          DEVICE_TREE_COMMIT_INPUT: ${{ inputs.device_tree_commit }}
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          set -euxo pipefail
          fox_dir="$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"
          test -d "$fox_dir/.repo"
          cd "$fox_dir"
          git clone https://github.com/RealHenryGX/twrp_device_ibrit_A25 device/ibrit/A25
          cd device/ibrit/A25
          if [ -n "$DEVICE_TREE_COMMIT_INPUT" ]; then
            git fetch --no-tags origin "$DEVICE_TREE_COMMIT_INPUT"
            git checkout --detach FETCH_HEAD
          else
            git checkout --detach "origin/$DEVICE_TREE_BRANCH"
          fi
          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$MANIFEST_BRANCH" >> "$GITHUB_ENV"
          tools/apply_fbe_recovery_patch.sh "$fox_dir/bootable/recovery"

      - name: Build recovery and adbd
        working-directory: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.manifest_branch }}
        run: |
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          lunch twrp_A25-eng
          mka adbd
          # Keep the device tree's real 32 MiB partition declaration, but
          # raise only the build-time max-size gate so an oversized image is
          # still produced for inspection and uploaded below.
          mka BOARD_RECOVERYIMAGE_PARTITION_SIZE=67108864 recoveryimage

      - name: Verify A25 recovery payload
        working-directory: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.manifest_branch }}/device/ibrit/A25
        run: |
          set -euxo pipefail
          python3 tools/verify_recovery_layout.py --ramdisk-root ../../../out/target/product/A25/recovery/root
          recovery_img=../../../out/target/product/A25/recovery.img
          test -f "$recovery_img"
          recovery_bytes=$(wc -c < "$recovery_img" | tr -d '[:space:]')
          kernel_bytes=$(od -An -tu4 -j8 -N4 "$recovery_img" | tr -d '[:space:]')
          ramdisk_bytes=$(od -An -tu4 -j16 -N4 "$recovery_img" | tr -d '[:space:]')
          page_size=$(od -An -tu4 -j36 -N4 "$recovery_img" | tr -d '[:space:]')
          [[ "$recovery_bytes" =~ ^[0-9]+$ && "$kernel_bytes" =~ ^[0-9]+$ && "$ramdisk_bytes" =~ ^[0-9]+$ && "$page_size" =~ ^[0-9]+$ ]]
          (( page_size > 0 && recovery_bytes > 0 && kernel_bytes > 0 && ramdisk_bytes > 0 ))
          ramdisk_offset=$(( ((2048 + kernel_bytes + page_size - 1) / page_size) * page_size ))
          payload_end=$((ramdisk_offset + ramdisk_bytes))
          recovery_partition_bytes=33554432
          recovery_usable_bytes=33484800
          recovery_over_bytes=$((payload_end - recovery_usable_bytes))
          (( recovery_over_bytes <= 0 ))
          {
            echo "recovery_img_bytes=$recovery_bytes"
            echo "kernel_bytes=$kernel_bytes"
            echo "ramdisk_bytes=$ramdisk_bytes"
            echo "page_size=$page_size"
            echo "payload_end_bytes=$payload_end"
            echo "partition_bytes=$recovery_partition_bytes"
            echo "usable_bytes=$recovery_usable_bytes"
            echo "over_usable_bytes=$recovery_over_bytes"
          } | tee recovery-size-summary.txt
          recovery_root=../../../out/target/product/A25/recovery/root
          find "$recovery_root" -type f -printf '%s\t%p\n' | sort -nr > recovery-file-sizes.txt
          du -x -B1 --max-depth=3 "$recovery_root" | sort -nr > recovery-directory-sizes.txt
          echo '--- largest recovery files ---'
          head -n 80 recovery-file-sizes.txt || true
          echo '--- recovery size summary ---'
          cat recovery-size-summary.txt
          {
            echo "manifest_branch=$MANIFEST_BRANCH"
            echo "manifest_sha=$MANIFEST_SHA"
            echo "device_tree_commit=$DEVICE_TREE_COMMIT"
            echo "TW_SKIP_ADDITIONAL_FSTAB=true"
            echo "recovery_partition_bytes=$recovery_partition_bytes"
            echo "recovery_usable_bytes=$recovery_usable_bytes"
          } > build-metadata.txt

      - name: Upload raw recovery outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofrp-a25-${{ github.run_id }}-raw
          if-no-files-found: warn
          path: |
            OrangeFox/fox_${{ inputs.manifest_branch }}/out/target/product/A25/recovery.img
            OrangeFox/fox_${{ inputs.manifest_branch }}/out/target/product/A25/OrangeFox*.img
            OrangeFox/fox_${{ inputs.manifest_branch }}/out/target/product/A25/OrangeFox*.zip
            OrangeFox/fox_${{ inputs.manifest_branch }}/device/ibrit/A25/recovery-size-summary.txt
            OrangeFox/fox_${{ inputs.manifest_branch }}/device/ibrit/A25/recovery-file-sizes.txt
            OrangeFox/fox_${{ inputs.manifest_branch }}/device/ibrit/A25/recovery-directory-sizes.txt
            OrangeFox/fox_${{ inputs.manifest_branch }}/device/ibrit/A25/build-metadata.txt

      - name: Upload recovery artifacts
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ofrp-a25-${{ github.run_id }}
          name: OrangeFox A25 ${{ github.run_id }}
          files: |
            OrangeFox/fox_${{ inputs.manifest_branch }}/out/target/product/A25/recovery.img
            OrangeFox/fox_${{ inputs.manifest_branch }}/out/target/product/A25/OrangeFox*.img
            OrangeFox/fox_${{ inputs.manifest_branch }}/out/target/product/A25/OrangeFox*.zip
          body: |
            Manifest branch: ${{ inputs.manifest_branch }}
            Manifest SHA: ${{ env.MANIFEST_SHA }}
            Device tree commit: ${{ env.DEVICE_TREE_COMMIT }}
