name: OrangeFox A25

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: OrangeFox manifest branch
        required: true
        default: '12.1'
      device_tree_branch:
        description: Device tree branch
        required: true
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          scripts_dir="$RUNNER_TEMP/orangefox-misc-scripts"
          rm -rf "$scripts_dir"
          git clone https://gitlab.com/OrangeFox/misc/scripts "$scripts_dir"
          cd "$scripts_dir"
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox
        env:
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git config --global user.name "lazycodebuilder"
          git config --global user.email "154446636+lazycodebuilder@users.noreply.github.com"
          echo "[sync] cloning OrangeFox sync helper"
          timeout --foreground --signal=TERM --kill-after=30s 10m git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          echo "[sync] starting OrangeFox manifest sync"
          timeout --foreground --signal=TERM --kill-after=30s 30m ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"
          echo "[sync] OrangeFox manifest sync completed"

      - name: Clone A25 device tree
        env:
          DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
        run: |
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_12.1"
          git clone https://github.com/RealHenryGX/twrp_device_ibrit_A25 -b "$DEVICE_TREE_BRANCH" device/ibrit/A25
          cd device/ibrit/A25
          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build recovery and adbd
        working-directory: ${{ github.workspace }}/OrangeFox/fox_12.1
        run: |
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          lunch twrp_A25-eng
          mka adbd
          # Keep the device tree's real 32 MiB partition declaration, but
          # raise only the build-time max-size gate so an oversized image is
          # still produced for inspection and uploaded below.
          mka BOARD_RECOVERYIMAGE_PARTITION_SIZE=67108864 recoveryimage

      - name: Verify A25 recovery payload
        continue-on-error: true
        working-directory: ${{ github.workspace }}/OrangeFox/fox_12.1/device/ibrit/A25
        run: |
          python3 tools/verify_recovery_layout.py
          find ../../../out/target/product/A25/recovery/root -type f \( -name '*adbd*' -o -name '*gatekeeper*' -o -name '*keymaster*' \) -print -exec stat -c '%A %n' {} \;
          init_hw=../../../out/target/product/A25/recovery/root/system/etc/init/hw/init.rc
          test -f "$init_hw"
          grep -Fq 'mount configfs none /config' "$init_hw"
          grep -Fq 'mount functionfs adb /dev/usb-ffs/adb' "$init_hw"
          grep -Fq 'write /config/usb_gadget/g1/UDC ${sys.usb.controller}' "$init_hw"
          grep -Fq 'sys.usb.config=adb && property:sys.usb.ffs.ready=1 && property:sys.usb.configfs=1' "$init_hw"
          grep -Fq 'mount ext4 /dev/block/by-name/vendor /vendor ro' ../../../out/target/product/A25/recovery/root/init.recovery.mt6765.rc
          grep -Fq 'start vendor.keymaster-4-1' ../../../out/target/product/A25/recovery/root/init.recovery.mt6765.rc
          grep -Fq 'start vendor.gatekeeper-1-0' ../../../out/target/product/A25/recovery/root/init.recovery.mt6765.rc
          ! grep -Fq 'mount configfs none /config' ../../../out/target/product/A25/recovery/root/init.recovery.usb.rc
          test -x ../../../out/target/product/A25/recovery/root/system/bin/keystore2
          test -e ../../../out/target/product/A25/recovery/root/system/lib64/stock/libkm_compat_service.so
          test -e ../../../out/target/product/A25/recovery/root/system/etc/vintf/manifest/android.hardware.keymaster@4.1-service.xml
          test -x ../../../out/target/product/A25/recovery/root/system/bin/hw/android.hardware.gatekeeper@1.0-service
          test -x ../../../out/target/product/A25/recovery/root/system/bin/hw/android.hardware.keymaster@4.1-service
          test -e ../../../out/target/product/A25/recovery/root/sbin/adbd || test -e ../../../out/target/product/A25/recovery/root/system/bin/adbd || test -e ../../../out/target/product/A25/recovery/root/system/bin/adbd.recovery
          recovery_img=../../../out/target/product/A25/recovery.img
          test -f "$recovery_img"
          recovery_bytes=$(stat -c %s "$recovery_img")
          recovery_partition_bytes=33554432
          recovery_usable_bytes=33484800
          recovery_over_bytes=$((recovery_bytes - recovery_usable_bytes))
          {
            echo "recovery_img_bytes=$recovery_bytes"
            echo "partition_bytes=$recovery_partition_bytes"
            echo "usable_bytes=$recovery_usable_bytes"
            echo "over_usable_bytes=$recovery_over_bytes"
          } | tee recovery-size-summary.txt
          recovery_root=../../../out/target/product/A25/recovery/root
          find "$recovery_root" -type f -printf '%s\t%p\n' | sort -nr > recovery-file-sizes.txt
          du -x -B1 --max-depth=3 "$recovery_root" | sort -nr > recovery-directory-sizes.txt || true
          echo '--- largest recovery files ---'
          head -n 80 recovery-file-sizes.txt

      - name: Upload raw recovery outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofrp-a25-${{ github.run_id }}-raw
          if-no-files-found: warn
          path: |
            OrangeFox/fox_12.1/out/target/product/A25/recovery.img
            OrangeFox/fox_12.1/out/target/product/A25/OrangeFox*.img
            OrangeFox/fox_12.1/out/target/product/A25/OrangeFox*.zip
            OrangeFox/fox_12.1/device/ibrit/A25/recovery-size-summary.txt
            OrangeFox/fox_12.1/device/ibrit/A25/recovery-file-sizes.txt
            OrangeFox/fox_12.1/device/ibrit/A25/recovery-directory-sizes.txt

      - name: Upload recovery artifacts
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ofrp-a25-${{ github.run_id }}
          name: OrangeFox A25 ${{ github.run_id }}
          files: |
            OrangeFox/fox_12.1/out/target/product/A25/recovery.img
            OrangeFox/fox_12.1/out/target/product/A25/OrangeFox*.img
            OrangeFox/fox_12.1/out/target/product/A25/OrangeFox*.zip
          body: |
            Device tree commit: ${{ env.DEVICE_TREE_COMMIT }}
