name: Archytas arm64 TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: TWRP manifest branch
        required: true
        default: twrp-12.1
        type: choice
        options: [twrp-12.1, twrp-11]
      KERNEL_REPO:
        description: AGUI-compatible 64-bit kernel repository
        required: true
        default: https://github.com/RealHenryGX/archimedes-kernel-64
      KERNEL_REF:
        description: Kernel branch or tag
        required: true
        default: main
      KERNEL_VARIANT:
        description: Kernel build variant
        required: true
        default: pure
        type: choice
        options: [pure, ksu]
      KERNEL_BOOT_URL:
        description: 32 MiB boot artifact from the selected kernel fork
        required: true
        default: https://github.com/RealHenryGX/archimedes-kernel-64/releases/latest/download/boot-archimedes-pure-32MiB.img
      DEVICE_TREE:
        description: Archytas TWRP device tree
        required: true
        default: https://github.com/victormc-dev/twrp_device_xiaomi_Archytas
      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      DEVICE_PATH: device/xiaomi/Archytas
      DEVICE_NAME: Archytas
      DEVICE_TREE_DTB: https://raw.githubusercontent.com/RealHenryGX/xiaomi-archytas-device-tree/main/dtb/archytas-main.dtb
      KERNEL_BOOT_URL: ${{ inputs.KERNEL_BOOT_URL }}

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Prepare build host
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev \
            device-tree-compiler gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gperf libc6-dev libxml2-utils xsltproc ccache liblz4-tool \
            libncurses-dev \
            libsdl1.2-dev build-essential git lzop pngcrush schedtool \
            squashfs-tools libbz2-dev lzma ncftp qemu-user-static python3

      - name: Install Java and repo
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          sudo ln -sf "$HOME/bin/repo" /usr/local/bin/repo

      - name: Download AGUI kernel artifact
        run: |
          mkdir -p "$RUNNER_TEMP/archytas-kernel"
          curl -fL "$KERNEL_BOOT_URL" -o "$RUNNER_TEMP/archytas-kernel/boot.img"
          python3 - "$RUNNER_TEMP/archytas-kernel/boot.img" "$RUNNER_TEMP/archytas-kernel/Image.gz-dtb" <<'PY'
          import pathlib, struct, sys
          src = pathlib.Path(sys.argv[1]).read_bytes()
          if len(src) != 32 * 1024 * 1024 or src[:8] != b"ANDROID!":
              raise SystemExit("kernel artifact is not a 32 MiB Android boot image")
          size = struct.unpack_from("<I", src, 8)[0]
          payload = src[2048:2048 + size]
          if not payload.startswith(b"\x1f\x8b"):
              raise SystemExit("boot kernel payload is not gzip")
          pathlib.Path(sys.argv[2]).write_bytes(payload)
          print(f"Image.gz-dtb payload: {len(payload)} bytes")
          PY

      - name: Package Archytas kernel with Wi-Fi DTB
        run: |
          mkdir -p "$RUNNER_TEMP/archytas-package"
          curl -fsSL "$DEVICE_TREE_DTB" -o "$RUNNER_TEMP/archytas-package/archytas-main.dtb"
          curl -fsSL https://raw.githubusercontent.com/RealHenryGX/archimedes-kernel-64/main/tools/archimedes-boot-template-32MiB.img \
            -o "$RUNNER_TEMP/archytas-package/template.img"
          python3 scripts/package_archytas_boot.py \
            --template "$RUNNER_TEMP/archytas-package/template.img" \
            --kernel "$RUNNER_TEMP/archytas-kernel/Image.gz-dtb" \
            --dtb "$RUNNER_TEMP/archytas-package/archytas-main.dtb" \
            --output "$RUNNER_TEMP/archytas-package/boot.img" \
            --kernel-output "$RUNNER_TEMP/archytas-package/Image.gz-dtb"

      - name: Initialize TWRP source
        run: |
          mkdir android-recovery
          cd android-recovery
          git config --global user.name lazycodebuilder
          git config --global user.email 154446636+lazycodebuilder@users.noreply.github.com
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b "${{ inputs.MANIFEST_BRANCH }}"
          repo sync -j$(nproc) --force-sync
          git clone --depth=1 --branch "${{ inputs.DEVICE_TREE_BRANCH }}" "${{ inputs.DEVICE_TREE }}" "$DEVICE_PATH"
          cp "$RUNNER_TEMP/archytas-package/Image.gz-dtb" "$DEVICE_PATH/prebuilt/kernel"

      - name: Build recovery
        working-directory: android-recovery
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_Archytas-eng
          mka adbd
          make recoveryimage -j$(nproc)
          test -s "out/target/product/$DEVICE_NAME/recovery.img"

      - name: Verify image
        working-directory: android-recovery
        run: |
          stat -c '%n %s bytes' "out/target/product/$DEVICE_NAME/recovery.img"
          file "out/target/product/$DEVICE_NAME/recovery.img"
          test "$(stat -c '%s' "out/target/product/$DEVICE_NAME/recovery.img")" -le 33554432

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: archytas-twrp-${{ github.run_id }}
          name: Archytas arm64 TWRP ${{ github.run_id }}
          files: android-recovery/out/target/product/Archytas/recovery.img
          body: |
            Archytas arm64 TWRP built from AGUI-compatible kernel `${{ inputs.KERNEL_REPO }}` @ `${{ inputs.KERNEL_REF }}`.
            Wi-Fi DTB: `${{ env.DEVICE_TREE_DTB }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
